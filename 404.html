<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page Not Found | SleepTots</title>

    <!-- Bootstrap CSS only -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- SleepTots existing typography -->
    <link rel="stylesheet" href="./css/typography.css">

    <!-- SleepTots existing global theme variables -->
    <link rel="stylesheet" href="./css/global.css">

    <!-- 404 page only -->
    <link rel="stylesheet" href="./css/404.css">
</head>


<body>

    <main class="st-404-page">

        <section class="st-404-section">

            <!-- Decorative background -->
            <div
                class="st-404-glow st-404-glow-one"
                aria-hidden="true"
            ></div>

            <div
                class="st-404-glow st-404-glow-two"
                aria-hidden="true"
            ></div>


            <!-- Decorative stars -->
            <div
                class="st-404-stars"
                aria-hidden="true"
            >
                <span class="st-404-star star-one"></span>
                <span class="st-404-star star-two"></span>
                <span class="st-404-star star-three"></span>
                <span class="st-404-star star-four"></span>
                <span class="st-404-star star-five"></span>
            </div>


            <div class="st-404-container">


                <!-- =====================================================
                     ILLUSTRATION
                     ===================================================== -->

                <div
                    class="st-404-illustration"
                    aria-hidden="true"
                >

                    <div class="st-404-moon">

                        <span class="st-404-crater crater-one"></span>
                        <span class="st-404-crater crater-two"></span>
                        <span class="st-404-crater crater-three"></span>

                    </div>


                    <div class="st-404-cloud cloud-one"></div>

                    <div class="st-404-cloud cloud-two"></div>


                    <!-- Decorative sleeping elements -->
                    <div class="st-404-orbit orbit-one"></div>

                    <div class="st-404-orbit orbit-two"></div>


                    <span class="st-404-dot dot-one"></span>
                    <span class="st-404-dot dot-two"></span>
                    <span class="st-404-dot dot-three"></span>

                </div>


                <!-- =====================================================
                     CONTENT
                     ===================================================== -->

                <div class="st-404-content">


                    <span class="st-404-eyebrow">
                        A little detour
                    </span>


                    <div
                        class="st-404-number"
                        aria-hidden="true"
                    >

                        <span>4</span>

                        <span class="st-404-zero">
                            <span class="st-404-zero-inner"></span>
                        </span>

                        <span>4</span>

                    </div>


                    <h1>
                        This page drifted off to sleep.
                    </h1>


                    <p class="st-404-description">
                        The page you're looking for isn't here anymore.
                        Let's get you back to a calmer place and continue
                        your little one's sleep journey.
                    </p>


                    <div class="st-404-actions">

                        <a
                            href="./home1.html"
                            class="st-404-primary"
                        >
                            <span>Back to Home</span>
                        </a>


                        <a
                            href="javascript:history.back()"
                            class="st-404-secondary"
                        >
                            <span>Go Back</span>
                        </a>

                    </div>


                    <p class="st-404-hint">
                        Better sleep starts with finding the right path.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- ================================================================
         EXISTING GLOBAL JAVASCRIPT

         This is important:
         It automatically restores the user's saved:
         - Dark mode
         - RTL mode

         using:
         sleeptots-theme
         sleeptots-rtl
         ================================================================ -->

    <script src="./js/global.js"></script>

</body>

</html>
