
<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
<!-- SleepTots Favicon -->
<link rel="icon" type="image/png" href="./images/logo.png">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign in to your SleepTots parent account."
    >

    <title>Login | SleepTots</title>


    <!-- =========================================================
         SLEEPTOTS GLOBAL STYLES
         ========================================================= -->

    <link rel="stylesheet" href="./css/global.css">


    <!-- =========================================================
         SLEEPTOTS TYPOGRAPHY
         ========================================================= -->

    <link rel="stylesheet" href="./css/typography.css">


    <!-- =========================================================
         LUCIDE ICONS
         ========================================================= -->

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./js/global.js"></script>

    <!-- =========================================================
         LOGIN PAGE CSS
         ========================================================= -->

    <link rel="stylesheet" href="./css/login.css">

</head>


<body>

    <!-- =========================================================
         LOGIN PAGE
         ========================================================= -->

    <main
        class="slt-login-page"
        id="loginPage"
    >


        <!-- =====================================================
             ANIMATED BACKGROUND
             ===================================================== -->

        <div
            class="slt-login-background"
            aria-hidden="true"
        >

            <div class="slt-bg-glow slt-bg-glow-one"></div>

            <div class="slt-bg-glow slt-bg-glow-two"></div>

            <div class="slt-bg-glow slt-bg-glow-three"></div>


            <div class="slt-bg-orbit slt-bg-orbit-one"></div>

            <div class="slt-bg-orbit slt-bg-orbit-two"></div>


            <div class="slt-bg-moon">
                <span></span>
            </div>


            <span class="slt-star slt-star-1"></span>
            <span class="slt-star slt-star-2"></span>
            <span class="slt-star slt-star-3"></span>
            <span class="slt-star slt-star-4"></span>
            <span class="slt-star slt-star-5"></span>
            <span class="slt-star slt-star-6"></span>


            <span class="slt-particle slt-particle-1"></span>
            <span class="slt-particle slt-particle-2"></span>
            <span class="slt-particle slt-particle-3"></span>
            <span class="slt-particle slt-particle-4"></span>
            <span class="slt-particle slt-particle-5"></span>


            <div class="slt-bg-wave slt-bg-wave-one"></div>
            <div class="slt-bg-wave slt-bg-wave-two"></div>

        </div>


        <!-- =====================================================
             TOP CONTROLS
             ===================================================== -->

        <div class="slt-login-controls">

            <!-- Theme -->

            <button
                type="button"
                class="slt-control-btn"
                id="themeToggle"
                data-theme-toggle
                aria-label="Switch to dark mode"
                title="Toggle dark mode"
            >

                <i
                    data-lucide="moon"
                    class="slt-theme-icon slt-moon-icon"
                ></i>

                <i
                    data-lucide="sun"
                    class="slt-theme-icon slt-sun-icon"
                ></i>

            </button>


            <!-- RTL -->

            <button
                type="button"
                class="slt-control-btn slt-rtl-btn"
                id="rtlToggle"
                data-rtl-toggle
                aria-label="Switch text direction"
                title="Toggle RTL"
            >
                <span class="rtl-label">RTL</span>
            </button>

        </div>


        <!-- =====================================================
             LOGIN CARD
             ===================================================== -->

        <section
            class="slt-login-card"
            aria-labelledby="loginTitle"
        >


            <!-- =================================================
                 BRAND
                 ================================================= -->

            <a
                href="./1index.html"
                class="st-brand slt-login-brand"
                aria-label="SleepTots Home"
            >

                
                    <img src="./images/logo.png" height="50px" width="50px" alt="logo">

                <span class="st-brand-title slt-brand-text">
                    <span class="brand-sleep">Sleep</span><span class="brand-tots">Tots</span>
                </span>

            </a>


            <!-- =================================================
                 INTRO
                 ================================================= -->

            <div class="slt-login-intro">

                <span class="st-label slt-login-eyebrow">
                    SLEEPTOTS PARENT PORTAL
                </span>

                <h1 id="loginTitle">
                    Welcome Back
                </h1>

                <p class="st-supporting slt-login-subtitle">
                    Sign in to continue your child's sleep journey.
                </p>

            </div>


            <!-- =================================================
                 LOGIN FORM
                 ================================================= -->

            <form
                class="slt-login-form"
                id="loginForm"
                novalidate
            >


                <!-- EMAIL -->

                <div class="st-form-group slt-form-group">

                    <label
                        for="email"
                        class="st-form-label"
                    >
                        Email Address
                    </label>

                    <div class="slt-input-wrap">

                        <i
                            data-lucide="mail"
                            class="slt-input-icon"
                        ></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="st-form-control slt-login-input"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="st-form-group slt-form-group">

                    <label
                        for="password"
                        class="st-form-label"
                    >
                        Password
                    </label>

                    <div class="slt-input-wrap">

                        <i
                            data-lucide="lock-keyhole"
                            class="slt-input-icon"
                        ></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="st-form-control slt-login-input slt-password-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="slt-password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            <i data-lucide="eye"></i>
                        </button>

                    </div>

                </div>


                <!-- REMEMBER / FORGOT -->

                <div class="slt-login-options">

                    <label class="slt-remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>
                            Remember Me
                        </span>

                    </label>


                    <a
                        href="./forgot-password.html"
                        class="slt-forgot-link"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- SIGN IN -->

                <button
                    type="submit"
                    class="st-btn st-btn-primary st-btn-block slt-login-submit"
                >

                    <span>
                        Sign In
                    </span>

                    <i data-lucide="arrow-right"></i>

                </button>


                <!-- DIVIDER -->

                <div class="slt-divider-row">

                    <span></span>

                    <small>
                        OR CONTINUE WITH
                    </small>

                    <span></span>

                </div>


                <!-- SOCIAL LOGIN -->

                <div class="slt-social-login">

                    <button
                        type="button"
                        class="slt-social-btn"
                    >
                        <span class="slt-google-icon">G</span>
                        <span>Google</span>
                    </button>


                    <button
                        type="button"
                        class="slt-social-btn"
                    >
                        
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                            <path
                                fill="currentColor"
                                d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09ZM12.03 7.25C11.88 5.02 13.69 3.18 15.82 3c.3 2.58-2.34 4.5-3.79 4.25Z"/>

                        </svg>
                        <span>Apple</span>
                    </button>


                    <button
                        type="button"
                        class="slt-social-btn"
                    >
                        <span class="slt-linkedin-icon">in</span>
                        <span>LinkedIn</span>
                    </button>

                </div>


                <!-- CREATE ACCOUNT -->

                <p class="slt-create-account">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="./signup.html">
                        Create an account
                    </a>

                </p>

            </form>

        </section>

    </main>
</body>

</html>
